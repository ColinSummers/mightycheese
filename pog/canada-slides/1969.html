<script>
(function() {
  var total = 3;
  var timer = null;
  function currentNum() {
    var h = location.hash;
    var m = h.match(/img-(\d+)/);
    return m ? parseInt(m[1], 10) : 0;
  }
  function advance() {
    var n = currentNum();
    if (n >= total) { stopSlideshow(); return; }
    location.hash = "#img-" + (n + 1);
  }
  function stopSlideshow() {
    if (timer) { clearInterval(timer); timer = null; }
    var el = document.getElementById("slideshow-start");
    el.textContent = "Start Slideshow";
    var counter = document.getElementById("slideshow-counter");
    if (counter) counter.remove();
  }
  function startSlideshow() {
    if (timer) { stopSlideshow(); return; }
    if (!location.hash.match(/img-/)) location.hash = "#img-1";
    var el = document.getElementById("slideshow-start");
    el.textContent = "Stop";
    var counter = document.createElement("span");
    counter.id = "slideshow-counter";
    el.parentNode.appendChild(counter);
    function updateCounter() { counter.textContent = " " + currentNum() + " / " + total; }
    updateCounter();
    timer = setInterval(function() {
      advance();
      updateCounter();
    }, 8000);
  }
  document.getElementById("slideshow-start").addEventListener("click", function(e) {
    e.preventDefault();
    startSlideshow();
  });
  window.addEventListener("hashchange", function() {
    if (!location.hash.match(/img-/) && timer) stopSlideshow();
  });
})();
</script>
