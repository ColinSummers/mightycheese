<script>
(function() {
  var total = 10;
  var timer = null;
  var startBtn = document.getElementById('slideshow-start');
  var stopBtn = document.getElementById('slideshow-stop');
  var counter = document.getElementById('slideshow-counter');

  function currentImg() {
    var h = location.hash;
    var m = h.match(/^#img-(\d+)$/);
    return m ? parseInt(m[1], 10) : 0;
  }

  function advance() {
    var cur = currentImg();
    if (cur >= total) {
      stop();
      return;
    }
    location.hash = '#img-' + (cur + 1);
    counter.textContent = (cur + 1) + ' / ' + total;
  }

  function stop() {
    clearInterval(timer);
    timer = null;
    stopBtn.style.display = 'none';
    startBtn.style.display = '';
    counter.textContent = '';
  }

  startBtn.addEventListener('click', function(e) {
    if (timer) return;
    startBtn.style.display = 'none';
    stopBtn.style.display = '';
    counter.textContent = '1 / ' + total;
    timer = setInterval(advance, 8000);
  });

  stopBtn.addEventListener('click', function() {
    stop();
    location.hash = '#_';
  });

  window.addEventListener('hashchange', function() {
    if (timer && currentImg() === 0) stop();
  });
})();
</script>
